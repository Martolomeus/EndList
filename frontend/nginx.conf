server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot container ("app" in compose.yaml).
    # The trailing slash on proxy_pass strips the /api prefix, just like the
    # Vite dev proxy: /api/tasks/1 -> http://app:8080/tasks/1
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they never change and can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
