services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: endlist
      POSTGRES_USER: endlist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Only reachable from the machine itself, not from the rest of the network
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endlist -d endlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database host is the service name "db", not localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/endlist
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
        # nginx looks up the app container's address once at startup, so restart
        # it whenever the app container is recreated (e.g. after a rebuild)
        restart: true
    ports:
      # Open http://<server>/ in the browser; change the left number if port 80 is taken
      - "80:80"

volumes:
  db-data:
